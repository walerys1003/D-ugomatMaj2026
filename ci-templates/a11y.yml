# ============================================================================
# Wave 9 / W9-3a — Accessibility CI gate (Axe + Pa11y on Next.js build).
#
# Runs on every PR and push to main. Builds the Next.js app, starts it in
# the background, then crawls 20 critical public + panel preview URLs with
# axe-core@4 and reports any:
#   - WCAG 2.1 AA violations  → FAIL the job
#   - serious / critical impact issues → FAIL the job
#   - minor / moderate issues → annotate but do not fail
#
# Reports uploaded as workflow artifact (HTML + JSON) for 30 days.
#
# Local equivalent:
#   pnpm --filter @apps/web build
#   pnpm --filter @apps/web start &
#   pnpm dlx @axe-core/cli http://localhost:3000/ --tags wcag2aa
# ============================================================================

name: a11y

on:
  pull_request:
    branches: [main, genspark_ai_developer]
    paths:
      - "apps/web/**"
      - ".github/workflows/a11y.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  axe:
    name: axe-core (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      SKIP_PROD_ENV_CHECK: "1"
      # CI-mode skips real network calls to Supabase/Stripe.
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      NEXT_PUBLIC_SUPABASE_URL: "https://stub.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "stub-anon-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js
        run: pnpm --filter @apps/web build

      - name: Start Next.js (background)
        run: |
          pnpm --filter @apps/web start &
          echo $! > /tmp/next.pid
          # Wait for server to accept connections (max 60s)
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/ > /dev/null 2>&1; then
              echo "Next.js up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Install axe CLI + Pa11y
        run: |
          npm install -g @axe-core/cli@4.10.0 pa11y@8.0.0

      - name: Run axe-core on critical URLs
        id: axe
        continue-on-error: true
        run: |
          mkdir -p a11y-reports
          URLS=(
            "http://localhost:3000/"
            "http://localhost:3000/cennik"
            "http://localhost:3000/jak-to-dziala"
            "http://localhost:3000/dla-firm"
            "http://localhost:3000/dla-kancelarii"
            "http://localhost:3000/api-publiczne"
            "http://localhost:3000/baza-wiedzy"
            "http://localhost:3000/baza-wiedzy/przedawnienie-dlugu"
            "http://localhost:3000/baza-wiedzy/sprzeciw-od-nakazu-zaplaty-epu"
            "http://localhost:3000/case-studies"
            "http://localhost:3000/bezpieczenstwo"
            "http://localhost:3000/changelog"
            "http://localhost:3000/regulamin"
            "http://localhost:3000/polityka-prywatnosci"
            "http://localhost:3000/cookies"
            "http://localhost:3000/kontakt"
            "http://localhost:3000/o-nas"
            "http://localhost:3000/logowanie"
            "http://localhost:3000/rejestracja"
            "http://localhost:3000/wizard"
          )
          FAIL=0
          SUMMARY="| URL | Violations | Serious | Critical |\n|---|---|---|---|\n"
          for url in "${URLS[@]}"; do
            slug=$(echo "$url" | sed 's|http://localhost:3000||;s|/|_|g;s|^_||')
            [ -z "$slug" ] && slug="root"
            OUT="a11y-reports/${slug}.json"
            axe "$url" --tags wcag2aa --save "$OUT" --exit || true
            if [ -f "$OUT" ]; then
              VIOL=$(jq '[.[].violations[]] | length' "$OUT" 2>/dev/null || echo "0")
              SERIOUS=$(jq '[.[].violations[] | select(.impact=="serious")] | length' "$OUT" 2>/dev/null || echo "0")
              CRITICAL=$(jq '[.[].violations[] | select(.impact=="critical")] | length' "$OUT" 2>/dev/null || echo "0")
              SUMMARY="${SUMMARY}| ${url} | ${VIOL} | ${SERIOUS} | ${CRITICAL} |\n"
              if [ "${CRITICAL:-0}" -gt 0 ] || [ "${SERIOUS:-0}" -gt 0 ]; then
                FAIL=1
              fi
            fi
          done
          echo -e "$SUMMARY" > a11y-reports/summary.md
          cat a11y-reports/summary.md
          if [ "$FAIL" = "1" ]; then
            echo "::error::Axe found WCAG 2.1 AA violations with serious or critical impact"
            exit 1
          fi

      - name: Stop Next.js
        if: always()
        run: |
          if [ -f /tmp/next.pid ]; then
            kill $(cat /tmp/next.pid) 2>/dev/null || true
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-reports-${{ github.run_id }}
          path: a11y-reports/
          retention-days: 30

      - name: Comment summary on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = 'a11y-reports/summary.md';
            let body = '## ♿ a11y (axe-core WCAG 2.1 AA)\n\n';
            if (fs.existsSync(summaryPath)) {
              body += fs.readFileSync(summaryPath, 'utf8');
            } else {
              body += '_No report generated (build failed?)_';
            }
            body += '\n\n_Full reports in workflow artifact._';
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
