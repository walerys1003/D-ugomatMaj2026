version: 2

# Tier 5.4 — automated dependency updates.
# Strategy: minor/patch auto-bumped weekly; major requires manual review.

updates:
  # ---------------------------------------------------------------------------
  # npm — apps/web workspace
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group all minor/patch updates into one PR per week.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Major updates — separate PRs, manual review.
    ignore:
      # Next.js majors require migration testing — manual only.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      # Supabase majors — breaking changes possible.
      - dependency-name: "@supabase/*"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions — workflows
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
